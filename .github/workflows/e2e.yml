name: E2E Locative (Grupo 6)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      permitir_escritura:
        description: 'Ejecutar los casos que crean propiedades QA6- en el sistema del Grupo 8 (CP-CU18-01 y CP-CU18-04)'
        type: boolean
        default: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      BASE_URL: https://proyecto-inmobiliario.vercel.app
      INMOBILIARIA_EMAIL: inmobiliaria1@gmail.com
      INQUILINO_EMAIL: inquilino1@gmail.com
      PROPIETARIO_EMAIL: propietario1@gmail.com
      INMOBILIARIA_PASSWORD: ${{ secrets.INMOBILIARIA_PASSWORD }}
      INQUILINO_PASSWORD: ${{ secrets.INQUILINO_PASSWORD }}
      PROPIETARIO_PASSWORD: ${{ secrets.PROPIETARIO_PASSWORD }}
      PERMITIR_ESCRITURA: ${{ github.event.inputs.permitir_escritura == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox

      - name: Ejecutar la suite
        run: npx playwright test

      - name: Resumen de resultados
        if: always()
        run: node scripts/resumen.js test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Publicar capturas, trazas y JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

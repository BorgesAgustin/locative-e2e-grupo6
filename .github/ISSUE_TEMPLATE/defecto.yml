name: Reporte de defecto
description: Registrar un defecto encontrado por el Grupo 6 en Locative (Grupo 8)
title: "[DEF-CUxx-nn] "
labels: ["defecto", "estado:abierto"]
body:
  - type: input
    id: caso
    attributes: { label: Caso de prueba, placeholder: "CP-CU18-02" }
    validations: { required: true }
  - type: dropdown
    id: criticidad
    attributes: { label: Criticidad, options: [Crítica, Alta, Media, Baja] }
    validations: { required: true }
  - type: dropdown
    id: prioridad
    attributes: { label: Prioridad, options: [Alta, Media, Baja] }
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes: { label: Pasos para reproducir, placeholder: "1. Ingresar como inmobiliaria\n2. ..." }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: Resultado esperado (según TP2) }
    validations: { required: true }
  - type: textarea
    id: obtenido
    attributes: { label: Resultado obtenido }
    validations: { required: true }
  - type: input
    id: entorno
    attributes: { label: Entorno, placeholder: "https://proyecto-inmobiliario.vercel.app · Chromium · 04/10/2026" }
  - type: textarea
    id: evidencia
    attributes: { label: Evidencia (capturas, traza de Playwright, datos usados) }
